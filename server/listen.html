<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>XIAO Live Audio</title>
</head>
<body>
  <h1>XIAO ESP32S3 Live Audio</h1>
  <button id="startBtn">Start Listening</button>
  <p id="status">Not connected.</p>

  <script>
    // Since the server and this page both run on the laptop hosting
    // the hotspot, "localhost" works here even though the XIAO itself
    // needs the real hotspot IP (set in the firmware's config.h).
    const SERVER_URL = "ws://localhost:8765/listen";
    const SAMPLE_RATE = 16000;

    let audioCtx;
    let nextPlayTime = 0;
    let ws;

    const statusEl = document.getElementById("status");

    document.getElementById("startBtn").onclick = () => {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
      nextPlayTime = audioCtx.currentTime;

      ws = new WebSocket(SERVER_URL);
      ws.binaryType = "arraybuffer";

      ws.onopen = () => {
        statusEl.textContent = "Connected. Waiting for audio...";
      };
      ws.onclose = () => {
        statusEl.textContent = "Disconnected.";
      };
      ws.onerror = (err) => {
        statusEl.textContent = "Error - see browser console.";
        console.error(err);
      };
      ws.onmessage = (event) => {
        const int16 = new Int16Array(event.data);
        const float32 = new Float32Array(int16.length);
        for (let i = 0; i < int16.length; i++) {
          float32[i] = int16[i] / 32768;
        }

        const buffer = audioCtx.createBuffer(1, float32.length, SAMPLE_RATE);
        buffer.copyToChannel(float32, 0);

        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);

        const startAt = Math.max(nextPlayTime, audioCtx.currentTime);
        source.start(startAt);
        nextPlayTime = startAt + buffer.duration;

        statusEl.textContent = "Streaming live.";
      };
    };
  </script>
</body>
</html>
